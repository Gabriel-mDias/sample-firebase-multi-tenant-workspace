spring:
  application:
    name: gems-firebase-multi-tenant
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  liquibase:
    change-log: classpath:/db/changelog/changelog-firebase-platform.xml
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
gems:
  firebase:
    auth:
      enabled: true
      jdbc-enabled: true
      project-id: ${FIREBASE_PROJECT_ID}
      check-revoked: true
      tenant-header: X-Tenant-Alias
      minimum-applied-migration: 1
      emulator:
        enabled: ${FIREBASE_EMULATOR_ENABLED:false}
  jpa:
    enabled: true
    base-packages: br.com.gems.app
  tenant:
    enabled: true
    strict-alias: true
    schema-prefix: tenant_
    global-schema: administracao
    validation-schema: modelo
    liquibase:
      changelog: classpath:/db/changelog/changelog-firebase-tenant.xml
      startup-enabled: false
  auditing:
    enabled: true
    context-columns-enabled: true
  aws:
    enabled: false
---
spring:
  config:
    activate:
      on-profile: local | test | ci | demo
gems:
  firebase:
    auth:
      emulator:
        host: ${FIREBASE_AUTH_EMULATOR_HOST}
