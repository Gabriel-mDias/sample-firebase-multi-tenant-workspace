spring:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  liquibase:
    change-log: classpath:/db/changelog/changelog-firebase-platform.xml
  main:
    banner-mode: off
gems:
  firebase:
    auth:
      enabled: true
      jdbc-enabled: true
      project-id: sample-isolated-test
      check-revoked: true
      tenant-header: X-Tenant-Alias
      minimum-applied-migration: 1
  jpa:
    enabled: true
    base-packages: br.com.gems.app
  tenant:
    enabled: true
    strict-alias: true
    schema-prefix: tenant_
    global-schema: administracao
    validation-schema: modelo
    liquibase:
      changelog: classpath:/db/changelog/changelog-firebase-tenant.xml
      startup-enabled: false
  auditing:
    enabled: true
    context-columns-enabled: true
  aws:
    enabled: false
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
logging:
  level:
    root: WARN
