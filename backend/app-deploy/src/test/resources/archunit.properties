# Gate N-04 (ConvencoesArquiteturaTest). O ArchUnit, por padrão, resolve pelo classpath toda classe
# que os tipos importados referenciam — inclusive o JDK inteiro, via jrt:/. As sete regras do gate só
# olham br.com.gems.meduc e os nomes DIRETOS de super-tipo e anotação, que o bytecode do próprio
# reator já traz; a resolução é custo sem retorno. Desligada, o gate lê o que precisa e nada mais.
#
# Histórico: até o ArchUnit 1.3.0, sob a JVM 26 local (o alvo é 21, e o desalinhamento é o mesmo
# que a 007 registrou na cobertura), o ASM embutido não lia "class file major version 70" e o import
# caía em recursão ao percorrer java.base — foi a razão original de desligar (008, N-B). Com o 1.5.0
# (bloco D da 009, 2026-09-13) a resolução ligada passou 8/8 em 14 s; a propriedade fica false pelo
# primeiro motivo, não mais pelo segundo.
resolveMissingDependenciesFromClassPath=false
