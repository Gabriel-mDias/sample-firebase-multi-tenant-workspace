name: gems-demo

# Explicit profiles only. Unprofiled startup starts no services.
services:
  sample-postgres:
    image: postgres:16
    profiles: [demo, local, test, ci]
    environment:
      POSTGRES_DB: gems_demo
      POSTGRES_USER: gems_demo
      POSTGRES_PASSWORD_FILE: /run/secrets/gems_demo_password
    secrets: [gems_demo_password]
    ports: ['127.0.0.1:5432:5432']
    volumes: [gems-demo-postgres:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U gems_demo -d gems_demo']
      interval: 5s
      timeout: 5s
      retries: 20
    labels:
      com.gems.sample.runtime: firebase-demo

  auth-emulator:
    build: ../shared/firebase
    image: gems-demo-auth-emulator:15.32.1
    profiles: [demo, local, test, ci]
    ports: ['127.0.0.1:9099:9099', '127.0.0.1:4000:4000']
    volumes: [gems-demo-auth:/data]
    stop_grace_period: 30s
    labels:
      com.gems.sample.runtime: firebase-demo

  backend:
    build: ../../backend
    image: gems-demo-backend:local
    profiles: [demo, local, test, ci]
    depends_on:
      sample-postgres: {condition: service_healthy}
      auth-emulator: {condition: service_healthy}
    environment:
      SPRING_PROFILES_ACTIVE: demo
      DB_URL: jdbc:postgresql://sample-postgres:5432/gems_demo
      DB_USERNAME: gems_demo
      FIREBASE_PROJECT_ID: demo-gems
      FIREBASE_EMULATOR_ENABLED: 'true'
      FIREBASE_AUTH_EMULATOR_HOST: auth-emulator:9099
    secrets: [gems_demo_password]
    ports: ['127.0.0.1:8080:8080']
    labels:
      com.gems.sample.runtime: firebase-demo

  frontend:
    build: ../../frontend
    image: gems-demo-frontend:local
    profiles: [demo, local, test, ci]
    depends_on:
      backend: {condition: service_healthy}
    environment:
      APP_RUNTIME_PROFILE: demo
      API_BASE_URL: /api
      FIREBASE_API_KEY: demo-web-public-config
      FIREBASE_AUTH_DOMAIN: localhost
      FIREBASE_PROJECT_ID: demo-gems
      FIREBASE_APP_ID: demo-gems-web
      AUTH_EMULATOR_URL: http://localhost:9099
    ports: ['127.0.0.1:4200:80']
    labels:
      com.gems.sample.runtime: firebase-demo

volumes:
  gems-demo-postgres:
    name: gems-demo-postgres
    labels:
      com.gems.sample.runtime: firebase-demo
  gems-demo-auth:
    name: gems-demo-auth
    labels:
      com.gems.sample.runtime: firebase-demo

secrets:
  gems_demo_password:
    file: ${GEMS_DEMO_PASSWORD_FILE:?Set GEMS_DEMO_PASSWORD_FILE to an external generated database password file}
