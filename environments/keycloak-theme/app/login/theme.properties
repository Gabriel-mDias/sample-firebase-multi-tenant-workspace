# Tema de login do App — layout de documento: um cartão em dois painéis, o da
# esquerda ilustrado e o da direita com o formulário.
#
# O conceito visual é do MOLDE, não do seu projeto. Trocá-lo — imagem, cores,
# logo, tipografia — é decisão de identidade, e nada aqui depende dela: o
# vocabulário de classes abaixo continua valendo qualquer que seja o desenho.
#
# parent=base (e NÃO keycloak.v2):
#   O tema padrão do Keycloak 26 é o `keycloak.v2`, que carrega ~600 KB de
#   PatternFly 5 via `stylesCommon`. Todo o design deste tema teria que vencer a
#   especificidade das classes `pf-v5-c-*` — exatamente o tipo de briga que o
#   frontend/src/styles.css já documenta (seletores duplicados `html .x.x` para
#   vencer a SDK). O `base` não traz folha de estilo alguma: tela em branco.
#
#   Consequência: sob o `base`, TODAS as chaves `properties.kc*` resolvem para
#   string vazia. Os templates do `base` já usam o operador `!` em todas elas,
#   então nada quebra — o markup apenas emite `class=""`. Por isso definimos
#   abaixo nosso próprio vocabulário de classes, apontando para o CSS semântico.
#
#   ARMADILHA DE DEBUG: um typo aqui NÃO gera exceção. A chave resolve para
#   vazio e a página simplesmente aparece sem estilo. Se algo não estilizar,
#   suspeite primeiro de um nome de chave errado neste arquivo.
#
# locales=pt-BR (apenas um):
#   O realm liga `internationalizationEnabled` com um ÚNICO locale. Isso entrega
#   as mensagens em português E mantém o seletor de idioma escondido, porque a
#   guarda do template.ftl é `locale.supported?size gt 1`. Omitir o i18n por
#   completo faria o Keycloak servir as mensagens do `base` em INGLÊS.
#
# Páginas não sobrescritas (login-otp, terms, logout-confirm, register, ...) são
# inalcançáveis com a configuração atual do realm (sem OTP, sem WebAuthn, sem
# IdP, registrationAllowed=false). Elas herdam do `base` e renderizam
# FUNCIONAIS, porém SEM ESTILO. Ligar OTP ou um provedor de identidade no futuro
# vai expô-las — nesse momento, sobrescreva-as também.

parent=base
locales=pt-BR

styles=css/app-login.css

meta=viewport==width=device-width,initial-scale=1

# --- Vocabulário de classes: kc* (Keycloak) -> app-* (nosso CSS) ------------

kcHtmlClass=app-html
kcBodyClass=app-body
kcLoginClass=app-shell

kcFormCardClass=app-doc
kcFormHeaderClass=app-doc__header
kcContentWrapperClass=app-doc__content

kcFormClass=app-form
kcFormGroupClass=app-field
kcLabelClass=app-label
kcLabelWrapperClass=app-label-wrap
kcInputClass=app-input
kcInputWrapperClass=app-input-wrap
kcInputGroup=app-input-group
kcInputErrorMessageClass=app-field__error

kcFormOptionsClass=app-form__options
kcFormOptionsWrapperClass=app-form__options-wrap
kcFormButtonsClass=app-form__buttons
kcFormSettingClass=app-form__settings

kcButtonClass=app-btn
kcButtonPrimaryClass=app-btn--primary
kcButtonDefaultClass=app-btn--ghost
kcButtonBlockClass=app-btn--block
kcButtonLargeClass=app-btn--lg

kcAlertClass=app-alert
kcAlertTitleClass=app-alert__title

# Os ícones abaixo viram `mask-image` SVG inline no CSS — sem icon-font, sem
# requisição extra. O `base` emite `<span class="...">` vazio; se a classe não
# for estilizada, o span fica invisível (inofensivo, mas perde-se o ícone).
kcFeedbackErrorIcon=app-icon app-icon--error
kcFeedbackWarningIcon=app-icon app-icon--warn
kcFeedbackSuccessIcon=app-icon app-icon--ok
kcFeedbackInfoIcon=app-icon app-icon--info
kcResetFlowIcon=app-icon app-icon--restart

kcFormPasswordVisibilityButtonClass=app-reveal
kcFormPasswordVisibilityIconShow=app-icon app-icon--eye
kcFormPasswordVisibilityIconHide=app-icon app-icon--eye-off

kcSignUpClass=app-info
kcInfoAreaWrapperClass=app-info__wrap

kcHeaderClass=app-skip-header
kcHeaderWrapperClass=app-skip-header__inner
