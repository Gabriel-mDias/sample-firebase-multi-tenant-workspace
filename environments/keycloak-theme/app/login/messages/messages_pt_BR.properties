# Mensagens pt-BR do tema App.
#
# O Keycloak faz MERGE dos bundles pela cadeia de parents, então aqui ficam
# apenas as chaves que precisam da voz do App. Tudo o que não está listado
# vem de base/login/messages/messages_pt_BR.properties, que já é razoável
# (doLogIn=Entrar, doCancel=Cancelar, pageExpiredMsg1/2, doClickHere, ...).
#
# ATENÇÃO: este arquivo precisa estar em LF. Com CRLF, o leitor de Properties do
# Java inclui o \r no VALOR da última chave. O .gitattributes na raiz do repo
# garante isso.

# --- Identidade / títulos ----------------------------------------------------
loginTitle=App — Acesso ao sistema
loginTitleHtml=App
loginAccountTitle=Acesse sua conta

# --- Campos e ações do login -------------------------------------------------
usernameOrEmail=Usuário ou e-mail
password=Senha
rememberMe=Continuar conectado
doLogIn=Entrar
doForgotPassword=Esqueci minha senha

# O `base` pt-BR não traduz estas duas (existem só no bundle `en`), e elas são
# usadas como aria-label do botão de revelar senha.
showPassword=Mostrar senha
hidePassword=Ocultar senha

# --- Recuperação de senha ----------------------------------------------------
emailForgotTitle=Recuperar acesso
emailInstruction=Informe seu usuário ou e-mail. Enviaremos as instruções para você criar uma nova senha.
# No `base`, doSubmit=Ok — genérico e confuso no contexto desta tela.
doSubmit=Enviar
backToLogin=Voltar para o acesso

# --- Nova senha --------------------------------------------------------------
updatePasswordTitle=Defina sua nova senha
passwordNew=Nova senha
passwordConfirm=Confirme a nova senha
logoutOtherSessions=Encerrar as sessões nos outros dispositivos

# --- Erros e estados ---------------------------------------------------------
pageExpiredTitle=Sessão expirada
errorTitle=Algo não saiu como esperado
invalidUserMessage=Usuário ou senha incorretos. Verifique os dados e tente novamente.
# bruteForceProtected=true no realm significa que usuários VÃO encontrar esta
# mensagem; a do `base` é seca e não orienta o que fazer.
accountTemporarilyDisabledMessage=Por segurança, o acesso foi bloqueado temporariamente após várias tentativas. Aguarde alguns minutos e tente novamente.
backToApplication=Voltar para o sistema
