# Realm do App como código.
#
# Aplicado pelo serviço one-shot `keycloak-config` (adorsys/keycloak-config-cli) contra um Keycloak
# JÁ NO AR. É este arquivo — e não o console administrativo — a fonte de verdade da identidade
# (Princípio IX da constituição).
#
# POR QUE NÃO É MAIS UM REALM JSON DE IMPORT
# ------------------------------------------
# O `--import-realm` do Keycloak roda apenas no PRIMEIRO boot contra um volume vazio. Num ambiente já
# provisionado — que é o caso de qualquer ambiente com dados — editar o JSON não tinha efeito algum,
# e a saída eram scripts shell rodados à mão, na ordem certa. Foi o esquecimento de um deles que quase
# já levou um cadastro de usuários quebrado para produção.
#
# SUBSTITUIÇÃO DE VARIÁVEL
# ------------------------
# A sintaxe é cifrão + parênteses com prefixo "env:", como nos valores abaixo. NÃO é o
# cifrão-chaves, que fica reservado à interpolação de mensagens do próprio Keycloak.
#
# CUIDADO AO COMENTAR: a substituição roda sobre o TEXTO CRU, antes do parse do YAML. Um exemplo da
# sintaxe escrito literalmente aqui em cima é tratado como variável de verdade e derruba a aplicação
# com "Cannot resolve variable". Foi o que aconteceu na primeira execução deste arquivo.
#
# OS 7 GRUPOS DE PERFIL NÃO ESTÃO AQUI, DE PROPÓSITO
# --------------------------------------------------
# Eles derivam do enum `PerfilAtuacao` e são convergidos a cada boot pelo
# `AutorizacaoBootstrap`. Declará-los também aqui criaria dois escritores para o mesmo recurso
# e duas fontes de verdade que divergiriam no dia em que alguém editasse só uma. A ferramenta não os
# remove: com o controle de estado remoto ligado, ela só apaga o que ela mesma criou — verificado.
#
# AS 25 AÇÕES E AS 7 COMPOSTAS `PERFIL_*` TAMBÉM NÃO ESTÃO AQUI, DE PROPÓSITO
# ----------------------------------------------------------------------------
# Elas derivam do enum `AcaoSistema` (25 realm roles de ação) e de `MapaPerfilAcoes` (as 7 compostas
# `PERFIL_*`), e são convergidas a cada boot pelo mesmo `AutorizacaoBootstrap`, na ordem
# garantirAcoes() > garantirCompostas() > garantirGrupos(). Pela mesma razão dos 7 grupos: declará-las
# aqui também criaria dois escritores para o mesmo recurso e duas fontes de verdade que divergiriam no
# dia em que alguém editasse só uma. `ADMIN` continua declarado abaixo porque ele NÃO nasce do
# bootstrap — é a composta de todas as ações, mas é atribuída diretamente ao usuário `admin.app`, e
# esse vínculo usuário↔role é identidade, não convergência de catálogo.

realm: app-realm
displayName: App Realm
enabled: true

loginTheme: app

# Um único locale com i18n LIGADO. Desligar faria o Keycloak servir mensagens em inglês do tema base;
# com um locale só, o seletor de idioma permanece oculto (a guarda no template é `size gt 1`).
internationalizationEnabled: true
supportedLocales:
  - pt-BR
defaultLocale: pt-BR

sslRequired: $(env:KEYCLOAK_SSL_REQUIRED)
registrationAllowed: false
loginWithEmailAllowed: true
duplicateEmailsAllowed: false
# DESLIGADO: não há bloco `smtpServer` neste realm, então o link "Esqueci minha senha"
# aparecia na tela de login e falhava ao ser usado. Um caminho que sempre falha é pior que caminho
# nenhum — e o fluxo de recuperação também é vetor de enumeração de usuário (a resposta difere entre
# e-mail existente e inexistente). Volta a `true` no mesmo commit que configurar SMTP.
resetPasswordAllowed: false
editUsernameAllowed: false
bruteForceProtected: true

# --- Trilha de auditoria de identidade -----------------------------------------------
# Sem isto o sistema vai para a internet sem registro de QUEM entrou e de QUEM alterou identidade.
# Não substitui a auditoria de dado de negócio, que é da aplicação: aqui fica quem logou, quem
# falhou ao logar e quem mexeu em usuário, grupo ou role — não quem alterou qual cliente.
eventsEnabled: true
eventsExpiration: 2592000
adminEventsEnabled: true
adminEventsDetailsEnabled: true

# --- Tempos de sessão e token ---------------------------------------------------------
# Declarados em vez de herdados. Os defaults do Keycloak são razoáveis HOJE, mas são defaults do
# produto: mudam entre versões, e a postura de segurança do App passaria a mudar junto, em
# silêncio, num `docker compose pull`.
accessTokenLifespan: 300
ssoSessionIdleTimeout: 1800
ssoSessionMaxLifespan: 36000

# Espelha o `PasswordUtil` do backend (minúscula, maiúscula, especial, mínimo 12). A validação da
# aplicação continua sendo a primeira linha e é a mais estrita — o `specialChars` do Keycloak aceita
# qualquer não-alfanumérico, enquanto o `PasswordUtil` restringe a um conjunto. Esta política existe
# para o caminho que a aplicação não cobre: uma senha trocada direto no console.
#
# ⚠️ MUDAR AQUI EXIGE MUDAR O `PasswordUtil` NO MESMO COMMIT. Divergência entre os dois faz o
# cadastro de usuário aceitar uma senha que o Keycloak recusa, e o operador vê um 502 no meio do
# wizard em vez de uma validação de campo.
#
# Mínimo de 12, e o PasswordUtil do backend espelha este número. Senhas JÁ cadastradas continuam válidas — a política só se aplica a
# senha nova. Mas o `APP_ADMIN_PASSWORD` do .env precisa passar nela: se não passar, o
# `app-keycloak-config` aborta e o backend não sobe (ele depende de service_completed_successfully).
passwordPolicy: "length(12) and lowerCase(1) and upperCase(1) and specialChars(1) and notUsername and notEmail"

clients:
  - clientId: app-frontend
    name: App Frontend
    description: SPA Angular, Authorization Code com PKCE.
    enabled: true
    protocol: openid-connect
    publicClient: true
    bearerOnly: false
    standardFlowEnabled: true
    implicitFlowEnabled: false
    # Cliente público não faz grant por senha. Ligar isto permitiria obter token com usuário e senha
    # fora do navegador — útil para teste manual, inaceitável como configuração padrão.
    directAccessGrantsEnabled: false
    serviceAccountsEnabled: false
    frontchannelLogout: true
    redirectUris:
      - $(env:APP_ORIGIN)/*
    webOrigins:
      - $(env:APP_ORIGIN)
    attributes:
      pkce.code.challenge.method: S256
      post.logout.redirect.uris: $(env:APP_ORIGIN)/*
    # `basic` é o escopo que carrega o mapper `sub` (e `auth_time`) para o ACCESS TOKEN. Ele é
    # default do realm, mas declarar `defaultClientScopes` aqui SUBSTITUI a lista inteira — omiti-lo
    # tira o `sub` do token sem tirar nada mais: as roles continuam chegando, o `@PreAuthorize`
    # continua passando, e só quebra quem precisa saber QUEM é o chamador. Foi assim que a chancela
    # de autoria estourou NullPointerException numa homologação.
    defaultClientScopes: [basic, web-origins, acr, profile, roles, email]
    optionalClientScopes: [address, phone, offline_access, microprofile-jwt]

  - clientId: app-backend
    name: App Backend
    description: Cliente confidencial das operações administrativas (Admin API).
    enabled: true
    protocol: openid-connect
    publicClient: false
    bearerOnly: false
    standardFlowEnabled: false
    implicitFlowEnabled: false
    directAccessGrantsEnabled: false
    clientAuthenticatorType: client-secret
    secret: $(env:KEYCLOAK_BACKEND_CLIENT_SECRET)
    # Ligar isto pelo import de realm no boot derrubava o Keycloak 26.0 com
    # "Session not bound to a realm". Aplicado contra um servidor já no ar, funciona — verificado.
    # É o que aposenta o antigo `enable-service-account.sh`.
    serviceAccountsEnabled: true
    redirectUris: []
    webOrigins: []
    # `basic` é o escopo que carrega o mapper `sub` (e `auth_time`) para o ACCESS TOKEN. Ele é
    # default do realm, mas declarar `defaultClientScopes` aqui SUBSTITUI a lista inteira — omiti-lo
    # tira o `sub` do token sem tirar nada mais: as roles continuam chegando, o `@PreAuthorize`
    # continua passando, e só quebra quem precisa saber QUEM é o chamador. Foi assim que a chancela
    # de autoria estourou NullPointerException numa homologação.
    defaultClientScopes: [basic, web-origins, acr, profile, roles, email]
    optionalClientScopes: [offline_access, microprofile-jwt]

roles:
  realm:
    # Composta de todas as 25 ações de AcaoSistema — quem tem ADMIN alcança qualquer ação nova sem
    # ninguém precise lembrar de concedê-la. As ações e as compostas PERFIL_* NÃO são declaradas
    # aqui: quem as cria é o AutorizacaoBootstrap, a partir do enum.
    - name: ADMIN
      description: Administrador — composta de todas as ações do sistema.

users:
  - username: admin.app
    enabled: true
    emailVerified: true
    firstName: App
    lastName: Admin
    email: $(env:APP_ADMIN_EMAIL)
    credentials:
      - type: password
        value: $(env:APP_ADMIN_PASSWORD)
        temporary: false
    # Único usuário do sistema com role atribuída diretamente. Todos os demais recebem permissão por
    # herança do grupo do seu perfil de atuação — ver o modelo de autorização no Princípio V.
    realmRoles: [ADMIN]

  # Permissões administrativas do backend. Sem elas, a criação de usuário pela Admin API devolve 403
  # e todo o cadastro de usuário falha. Isso passa despercebido enquanto ninguém chama a API — porque
  # o `KeycloakUserService` existia desde o início e nunca havia sido chamado por linha de código.
  # É o que aposenta o antigo `grant-realm-management-roles.sh`.
  - username: service-account-app-backend
    enabled: true
    serviceAccountClientId: app-backend
    # Reduzir este conjunto foi avaliado e NÃO é possível hoje. O que o
    # `AutorizacaoBootstrap` faz a cada boot é: criar realm role (uma por ação de `AcaoSistema`),
    # criar as compostas `PERFIL_*`, ler e acrescentar filhos a elas (`addComposites`,
    # `getRoleComposites`) e criar grupo. Criar e compor **realm role** é operação de escopo de
    # realm — `manage-users` não a cobre. Então `manage-realm` permanece.
    #
    # A consequência fica escrita em vez de silenciosa: se o `KEYCLOAK_BACKEND_CLIENT_SECRET`
    # vazar, o portador reconfigura o realm inteiro, não só usuários. Isso torna a rotação desse
    # segredo (vps/06) mais importante que a das outras senhas.
    #
    # O caminho para reduzir de verdade seria tirar a criação de role do runtime e deixá-la só no
    # realm YAML — mas aí o catálogo de ações passaria a exigir edição em dois lugares a cada ação
    # nova, que é exatamente o acoplamento que o modelo por ações remove.
    clientRoles:
      realm-management:
        - manage-users
        - view-users
        - manage-realm
        - view-realm
