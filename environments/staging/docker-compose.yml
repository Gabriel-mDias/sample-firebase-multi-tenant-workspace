# Ambiente de STAGING (homologação), na MESMA VPS da produção.
#
# O que ele é: uma segunda stack completa — banco, Keycloak, backend e frontend próprios — servindo
# três subdomínios `staging.*`. É onde o product owner homologa uma entrega sem depender da máquina
# de quem desenvolve.
#
# O QUE ELE NÃO TEM, E POR QUÊ
# ----------------------------
#  - **Caddy.** Existe um único proxy na máquina, na stack de produção, e ele serve os seis domínios
#   . A consequência está declarada: derrubar produção derruba o acesso a
#    staging. Os blocos de staging vivem em ../production/Caddyfile.
#  - **Backup.** Staging não é copiado. O dado aqui é sintético e recriável por definição,
#    e copiá-lo gastaria armazenamento para proteger algo que ninguém quer de volta.
#
# O QUE NUNCA PODE ENTRAR AQUI
# ----------------------------
# Dado pessoal real. Nem carga, nem importação, nem restore de um dump de produção "só para testar".
# É requisito da rodada e é conferido pelo gate correspondente do quickstart — que é RECORRENTE, não de
# entrega única, justamente porque nada impede alguém fazer isso depois desta rodada.
#
# ISOLAMENTO
# ----------
# Rede, volume, servidor Postgres, instância de Keycloak, bucket S3 e TODAS as senhas são próprios.
# Nada é reaproveitado de produção. O realm é o mesmo ARQUIVO, aplicado a uma instância separada.
#
# Roteiro de operação: environments/vps/08-staging.md

name: app-staging

services:
  app-staging-postgres:
    image: postgres:16
    container_name: app-staging-postgres
    restart: unless-stopped
    # Sem `ports`. O Caddy não fala com o banco, e publicar 5432 numa máquina com IP público seria
    # expor o banco de staging — que compartilha o host com o de produção.
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER:?defina no .env}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?defina no .env}
      APP_DB_NAME: ${APP_DB_NAME:-app-db}
      APP_DB_USER: ${APP_DB_USER:-app-access}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?defina no .env}
      KEYCLOAK_DB_NAME: ${KEYCLOAK_DB_NAME:-keycloak-db}
      KEYCLOAK_DB_USER: ${KEYCLOAK_DB_USER:-keycloak-access}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?defina no .env}
    volumes:
      # O MESMO script de produção, sem cópia. Ele é parametrizado por variável e não sabe em que
      # ambiente está — verificado no teste correspondente.
      - ../shared/init-postgres.sh:/docker-entrypoint-initdb.d/init-postgres.sh:ro
      - staging_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${APP_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 15s
    mem_limit: 384m
    networks:
      - app-staging-network

  app-staging-keycloak:
    image: quay.io/keycloak/keycloak:26.0.8
    container_name: app-staging-keycloak
    restart: unless-stopped
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://app-staging-postgres:5432/${KEYCLOAK_DB_NAME:-keycloak-db}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER:-keycloak-access}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?defina no .env}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:?defina no .env}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?defina no .env}
      # Entra no `iss` de todo token. Precisa ser o domínio público de STAGING — apontar para o de
      # produção faria staging emitir tokens que o backend de produção aceitaria.
      KC_HOSTNAME: https://${AUTH_DOMAIN:?defina no .env}
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      # Teto de heap explícito — o requisito vale para os dois ambientes. Sem ele, as JVMs de staging
      # dimensionariam heap pelos 8 GB do host e derrubariam produção. Menor que o de produção de
      # propósito: staging atende uma pessoa homologando, não a operação.
      JAVA_OPTS_KC_HEAP: -Xms192m -Xmx576m
    command: start
    depends_on:
      app-staging-postgres:
        condition: service_healthy
    volumes:
      - ../keycloak-theme:/opt/keycloak/themes:ro
    healthcheck:
      # A imagem não tem curl nem wget — só bash. Idêntica à de produção pelo mesmo motivo.
      test:
        - CMD-SHELL
        - >
          exec 3<>/dev/tcp/localhost/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"status": "UP"' <&3
      interval: 10s
      timeout: 5s
      retries: 40
      start_period: 60s
    mem_limit: 768m
    networks:
      - app-staging-network

  app-staging-keycloak-config:
    image: adorsys/keycloak-config-cli:6.5.1-26.0.5
    container_name: app-staging-keycloak-config
    restart: "no"
    depends_on:
      app-staging-keycloak:
        condition: service_healthy
    environment:
      KEYCLOAK_URL: http://app-staging-keycloak:8080
      KEYCLOAK_USER: ${KEYCLOAK_ADMIN_USER:?defina no .env}
      KEYCLOAK_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?defina no .env}
      IMPORT_FILES_LOCATIONS: /config/*.yaml
      IMPORT_VARSUBSTITUTION_ENABLED: "true"
      # Sem isto, uma alteração feita no console administrativo sobreviveria a todos os deploys
      # seguintes, em silêncio — e em staging isso é pior que em produção, porque staging existe
      # justamente para provar que o realm versionado está correto.
      IMPORT_CACHE_ENABLED: "false"
      IMPORT_MANAGED_GROUP: no-delete
      IMPORT_MANAGED_CLIENT: no-delete
      IMPORT_MANAGED_ROLE: no-delete
      APP_ORIGIN: https://${APP_DOMAIN:?defina no .env}
      KEYCLOAK_SSL_REQUIRED: all
      KEYCLOAK_BACKEND_CLIENT_SECRET: ${KEYCLOAK_BACKEND_CLIENT_SECRET:?defina no .env}
      APP_ADMIN_EMAIL: ${APP_ADMIN_EMAIL:?defina no .env}
      APP_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD:?defina no .env}
    volumes:
      # O MESMO arquivo de realm de produção, montado sem cópia. Um segundo arquivo
      # divergiria em silêncio da produção, e o ambiente que deveria provar a entrega passaria a
      # provar outra coisa. Ele difere só pelas variáveis substituídas acima.
      - ../shared/keycloak:/config:ro
    mem_limit: 256m
    networks:
      - app-staging-network

  app-staging-backend:
    image: ghcr.io/${GHCR_OWNER:?defina no .env}/app-backend:${IMAGE_TAG:-latest}
    container_name: app-staging-backend
    restart: unless-stopped
    depends_on:
      app-staging-postgres:
        condition: service_healthy
      app-staging-keycloak-config:
        condition: service_completed_successfully
    environment:
      # Ver o comentário equivalente no compose de produção: JAVA_OPTS seria inerte com o ENTRYPOINT
      # em forma exec do backend/Dockerfile.
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75
      DB_URL: jdbc:postgresql://app-staging-postgres:5432/${APP_DB_NAME:-app-db}
      DB_USERNAME: ${APP_DB_USER:-app-access}
      DB_PASSWORD: ${APP_DB_PASSWORD:?defina no .env}

      KEYCLOAK_ISSUER_URI: https://${AUTH_DOMAIN}/realms/app-realm
      KEYCLOAK_JWK_SET_URI: http://app-staging-keycloak:8080/realms/app-realm/protocol/openid-connect/certs
      KEYCLOAK_SERVER_URL: http://app-staging-keycloak:8080
      KEYCLOAK_REALM: app-realm
      KEYCLOAK_BACKEND_CLIENT_ID: app-backend
      KEYCLOAK_BACKEND_CLIENT_SECRET: ${KEYCLOAK_BACKEND_CLIENT_SECRET:?defina no .env}

      APP_CORS_ALLOWED_ORIGINS: https://${APP_DOMAIN}

      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ENDPOINT: ${AWS_ENDPOINT:-https://s3.us-east-1.amazonaws.com}
      # Bucket e credencial PRÓPRIOS. A credencial de staging não pode alcançar o bucket de produção
      # nem o de backup — é o que o gate G5 verifica.
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:?defina no .env}
      AWS_ACCESS_KEY: ${AWS_ACCESS_KEY:?defina no .env}
      AWS_SECRET_KEY: ${AWS_SECRET_KEY:?defina no .env}
    mem_limit: 768m
    networks:
      - app-staging-network

  app-staging-frontend:
    image: ghcr.io/${GHCR_OWNER:?defina no .env}/app-frontend:${IMAGE_TAG:-latest}
    container_name: app-staging-frontend
    restart: unless-stopped
    environment:
      # A MESMA imagem de produção, repontada em runtime pelo env.js que o entrypoint gera. É isto
      # que faz staging provar a imagem que vai para produção, e não uma parecida.
      API_BASE_URL: https://${API_DOMAIN:?defina no .env}
      OIDC_ISSUER: https://${AUTH_DOMAIN}/realms/app-realm
      OIDC_CLIENT_ID: app-frontend
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    mem_limit: 64m
    networks:
      - app-staging-network

volumes:
  staging_postgres_data:
    # Nome explícito e distinto do de produção (`app_postgres_data`). Repetir este nome é o erro
    # que destruiria o banco de produção sem falhar em teste nenhum — é o que o gate L2 procura.
    name: app_staging_postgres_data

networks:
  # EXTERNA nas duas stacks, criada uma única vez pelo operador:
  #     docker network create app_staging_network
  #
  # Não é o compose de staging que a cria: se fosse, um `docker compose down` aqui levaria a rede
  # junto e o Caddy de produção a perderia na reinicialização seguinte, em silêncio.
  app-staging-network:
    name: app_staging_network
    external: true
