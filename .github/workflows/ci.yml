# Gate de teste. Princípio VII: nenhum PR entra com ele vermelho.
#
# POR QUE ESTE WORKFLOW EXISTE
# ----------------------------
# O Princípio VII da constituição declara, como NÃO NEGOCIÁVEL, que o gate de merge é
# `mvnw clean install` verde, `npm test` verde e `npm run build` verde. Até esta rodada não havia
# nada que o impusesse: os dois workflows existentes constroem e publicam imagem, e nenhum roda
# teste. As rodadas 012 e 013 chegaram a `main` sob confiança de que alguém tinha rodado localmente.
#
# Este arquivo não muda a regra — ele a torna verificável.
#
# CREDENCIAL DO REGISTRO PRIVADO
# ------------------------------
# Os dois jobs precisam ler do GitHub Packages — `br.com.gems:gems-*` no backend e
# `@gabriel-mdias/angular-gems-sdk` no frontend —, e o Packages exige autenticação **até para
# leitura**. Sem credencial o resultado é 401 na resolução de dependência, não falha de código.
#
# A credencial vem do `GITHUB_TOKEN` automático do Actions, que já carrega `packages: read`
# (declarado em `permissions` abaixo). Isso dispensa cadastrar um PAT: a primeira execução deste
# workflow falhou justamente porque os secrets GEMS_REGISTRY_* não existiam no repositório, e
# depender de um passo manual de configuração é o tipo de gate que nasce quebrado.
#
# Os secrets continuam tendo precedência quando existirem (`secrets.X || fallback`): eles são o
# caminho necessário se o pacote for publicado por uma conta diferente, ou se não conceder acesso a
# este repositório em "Package settings > Manage Actions access".
name: CI

on:
  pull_request:
  push:
    branches: [main]

# Um PR que recebe vários pushes seguidos não precisa manter as execuções antigas vivas.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  agent-context:
    name: Contexto de agentes — orçamento e paridade
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Também protege contra um futuro `gems-ai-sdk sync` que volte a inflar o bloco gerado do
      # AGENTS.md: o arquivo raiz tem orçamento explícito e a regra específica vive por camada.
      - name: Validar contexto mínimo
        shell: pwsh
        run: ./scripts/verificar-contexto-agentes.ps1

  # Gate das rules GEMS AI 3.0.0. A CLI vem do repositório do SDK, no commit pinado em gems-ai.json
  # (o mesmo que scripts/gems-ai.ps1 confere localmente). Se o repositório do SDK for privado, o
  # secret GEMS_AI_SDK_TOKEN precisa dar leitura a ele; sem o secret cai no token automático.
  #
  # Roda em windows-latest: o lock gerado pela CLI grava caminhos com `\` e o SDK pinado não os
  # normaliza (project.py:364), então o check falha em Ubuntu. Voltar para ubuntu-latest depende
  # de normalização na própria CLI.
  gems-ai:
    name: GEMS AI — gate das rules
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Ler commit do SDK pinado
        id: pin
        shell: pwsh
        run: |
          $commit = (Get-Content -Raw gems-ai.json | ConvertFrom-Json).commit
          "commit=$commit" >> $env:GITHUB_OUTPUT

      - name: Checkout do gems-ai-sdk
        uses: actions/checkout@v7
        with:
          repository: Gabriel-mDias/gems-ai-sdk
          ref: ${{ steps.pin.outputs.commit }}
          path: gems-ai-sdk
          token: ${{ secrets.GEMS_AI_SDK_TOKEN || github.token }}

      - name: Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Gate GEMS AI
        shell: pwsh
        run: ./scripts/gems-ai-gate.ps1
        env:
          GEMS_AI_SDK_SRC: ${{ github.workspace }}/gems-ai-sdk/src

  backend:
    name: Backend — reator Maven com testes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Spotless ratchetFrom=411156d requires history

      - name: JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: "21"
          distribution: temurin
          cache: maven
          # O <id> PRECISA ser `github`, idêntico ao <repositories> de backend/pom.xml. Id divergente
          # faz o Maven simplesmente não aplicar a credencial, e o sintoma é um 401 indistinguível de
          # credencial errada — é o defeito latente mais comum num Dockerfile que gera settings.xml.
          server-id: github
          server-username: GEMS_REGISTRY_USER
          server-password: GEMS_REGISTRY_TOKEN

      # Os testes de integração do app-deploy sobem um Postgres efêmero por Testcontainers.
      # O runner do GitHub já tem Docker, então não é preciso serviço declarado aqui: o Testcontainers
      # gerencia o ciclo de vida do container sozinho.
      # `chmod +x` como cinto de segurança, não como correção: o bit de execução do `mvnw` está no
      # índice do git (modo 100755). Sem ele, o arquivo foi commitado de uma
      # máquina Windows, onde o git não rastreia o modo —, e a primeira execução deste workflow
      # morreu com `./mvnw: Permission denied` (exit 126). Nunca doeu antes porque nada executava o
      # wrapper: o `backend/Dockerfile` usa o `mvn` da imagem base. A linha fica porque um checkout
      # feito por outra ferramenta pode não preservar o modo, e o custo dela é zero.
      - name: Build do reator com testes
        run: |
          chmod +x ./mvnw
          ./mvnw -B clean install
        working-directory: backend
        env:
          GEMS_REGISTRY_USER: ${{ secrets.GEMS_REGISTRY_USER || github.actor }}
          GEMS_REGISTRY_TOKEN: ${{ secrets.GEMS_REGISTRY_TOKEN || secrets.GITHUB_TOKEN }}

      # Sobe o relatório mesmo com a suíte vermelha — é justamente aí que ele serve.
      - name: Relatórios de teste
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports
          path: backend/*/target/surefire-reports/
          if-no-files-found: ignore

  frontend:
    name: Frontend — testes, build e formatação
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Node 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Credencial do registro privado
        run: |
          printf '@gabriel-mdias:registry=https://npm.pkg.github.com\n//npm.pkg.github.com/:_authToken=%s\n' \
            "$GEMS_REGISTRY_TOKEN" > .npmrc
        working-directory: frontend
        env:
          GEMS_REGISTRY_TOKEN: ${{ secrets.GEMS_REGISTRY_TOKEN || secrets.GITHUB_TOKEN }}

      # Angular 22 usa angular-gems-sdk 3.0.0 e overrides de peers do keycloak-angular.
      # npm ci instala as versões registradas no lockfile.
      - name: Instalar dependências
        run: npm ci
        working-directory: frontend

      - name: Testes
        run: npm test
        working-directory: frontend

      - name: Build de produção
        run: npm run build
        working-directory: frontend

      # O projeto não tem ESLint: o Prettier é a única verificação de estilo, e até aqui dependia de
      # alguém lembrar de rodá-lo à mão. --check falha em vez de reescrever.
      - name: Formatação
        run: npx prettier --check .
        working-directory: frontend
