# Publica em produção. SÓ workflow_dispatch — nunca dispara sozinho a partir de push/PR (o requisito:
# publicação em ambiente externo precisa ser deliberada). A VPS não compila nada aqui, só troca
# a imagem já publicada por build-images.yml: `docker compose pull` + `up -d`.
#
# Pré-requisito que este workflow NÃO cobre: o repositório precisa já estar clonado na VPS, com
# environments/production/.env preenchido a partir do .env.example (segredos reais da VPS, fora
# do controle de versão). O roteiro completo de primeiro deploy fica em
# environments/vps/.
name: Deploy em Produção

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Tag das imagens (backend/frontend) a publicar'
        required: false
        default: latest
        type: string

jobs:
  deploy:
    name: Deploy via SSH
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy remoto
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          # IMAGE_TAG chega como env var para o shell remoto usar no lugar de editar o .env da VPS
          # a cada deploy — compose lê IMAGE_TAG de ambiente se o compose de produção referenciar
          # ${IMAGE_TAG:-latest} nas imagens (ver environments/production/docker-compose.yml).
          envs: IMAGE_TAG
          script: |
            set -eu
            # Assume clone padrão de `git clone` (nome do repositório GitHub: app-project) na
            # home do usuário SSH. Se o roteiro de VPS (environments/vps/) definir outro caminho,
            # ajuste este `cd` — não há como descobrir o caminho real sem uma VPS provisionada.
            cd app-project
            docker compose -f environments/production/docker-compose.yml pull
            docker compose -f environments/production/docker-compose.yml up -d
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
