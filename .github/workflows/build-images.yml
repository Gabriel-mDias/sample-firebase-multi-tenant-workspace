# Constrói e publica as imagens Docker do App no GHCR. A VPS nunca compila: ela só faz
# `docker compose pull` a partir daqui. Ver .github/workflows/deploy.yml para a publicação em si,
# que é sempre manual e não depende deste workflow além de consumir as tags que ele gera.
name: Build e Publicação de Imagens

on:
  push:
    branches: [main]
    tags: ['v*']

env:
  REGISTRY: ghcr.io
  # GHCR exige nome de imagem em minúsculo; github.repository_owner pode vir com maiúsculas
  # dependendo de como a conta/organização foi criada, então normalizamos aqui.
  IMAGE_OWNER: ${{ github.repository_owner }}

jobs:
  backend:
    name: Build backend
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Login no GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalizar nome do owner
        id: owner
        run: echo "lowercase=${IMAGE_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Extrair metadados (tags/labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ steps.owner.outputs.lowercase }}/app-backend
          tags: |
            type=raw,value=latest
            type=sha,format=short
            type=semver,pattern={{version}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build e push
        uses: docker/build-push-action@v7
        with:
          context: backend
          file: backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GEMS_REGISTRY_USER=${{ secrets.GEMS_REGISTRY_USER || github.actor }}
          # As duas dependências GEMS exigem credencial — sem ela o download falha com 401 nos dois registries, com
          # token ausente, e este workflow falhou por isso nas três primeiras vezes em que rodou.
          # O GITHUB_TOKEN automático já serve (o job tem `packages: write`, que inclui leitura), e
          # é o fallback: um gate que só funciona depois de um passo manual de configuração nasce
          # quebrado. Os secrets continuam tendo precedência quando existirem — é o caminho
          # necessário se o pacote passar a ser publicado por outra conta.
          secrets: |
            gems_registry_token=${{ secrets.GEMS_REGISTRY_TOKEN || secrets.GITHUB_TOKEN }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  frontend:
    name: Build frontend
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Login no GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalizar nome do owner
        id: owner
        run: echo "lowercase=${IMAGE_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Extrair metadados (tags/labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ steps.owner.outputs.lowercase }}/app-frontend
          tags: |
            type=raw,value=latest
            type=sha,format=short
            type=semver,pattern={{version}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build e push
        uses: docker/build-push-action@v7
        with:
          context: frontend
          file: frontend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          secrets: |
            gems_registry_token=${{ secrets.GEMS_REGISTRY_TOKEN || secrets.GITHUB_TOKEN }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
