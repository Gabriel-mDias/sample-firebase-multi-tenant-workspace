# Configuração do nginx que serve a SPA Angular (build de produção, output em
# dist/app/browser — nome do projeto em angular.json).
#
# `try_files ... /index.html` é o fallback de roteamento de SPA: o Angular Router decide as rotas
# no cliente, então qualquer caminho que não bata em arquivo físico (ex.: /parceiros/novo,
# depois de um F5) precisa cair de volta no index.html em vez de dar 404 do nginx.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # env.js é gerado em runtime pelo docker-entrypoint.sh a partir de variáveis de ambiente do
    # contêiner (ver FR-014/SC-007) — nunca deve ficar em cache do navegador, senão repontar a
    # API exige também invalidar cache manualmente.
    location = /env.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires -1;
    }
}
