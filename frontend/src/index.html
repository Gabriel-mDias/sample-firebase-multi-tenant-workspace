<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>App</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Sem favicon: o molde não carrega marca. Ao adotar uma, ponha os arquivos em
       frontend/public/ (o `assets` de angular.json copia essa pasta inteira) e declare-os
       aqui — o SVG primeiro, nítido em qualquer densidade, com o .ico como fallback:

       <link rel="icon" type="image/svg+xml" href="emblema.svg" />
       <link rel="icon" type="image/x-icon" href="favicon.ico" />

       Declarar um href sem o arquivo correspondente rende 404 no console e o ícone
       genérico do navegador — pior que não declarar nada. -->
    <meta name="theme-color" content="#2563EB" />
    <script src="env.js"></script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
