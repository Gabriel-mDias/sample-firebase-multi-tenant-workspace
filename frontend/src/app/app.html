@if (showShell()) {
  <div class="app-shell" [class.menu-collapsed]="menuCollapsed()">
    <gems-side-menu
      [config]="menuConfig()"
      appName="G&Ms"
      logoFull="brand/gems-wordmark.svg"
      logoutLabel="Sair"
      logoutTitle="Encerrar sessão"
      [userName]="auth.username()"
      [userEmail]="auth.email()"
      [userInitials]="auth.initials()"
      (logoutClick)="onLogout()"
      (collapsedChange)="menuCollapsed.set($event)"
    />
    <main class="app-content">
      <div class="tenant-bar">
        <span>{{ auth.currentTenant()?.name || 'Nenhuma empresa selecionada' }}</span
        ><button
          type="button"
          class="btn-secondary"
          [disabled]="auth.loading()"
          (click)="changeTenant()"
        >
          <i class="fa-solid fa-building" aria-hidden="true"></i> Trocar empresa
        </button>
      </div>
      @if (auth.loading()) {
        <p class="form-loading" role="status">Validando acesso…</p>
      } @else {
        <router-outlet />
      }
    </main>
    <app-footer />
  </div>
} @else {
  <router-outlet />
}
