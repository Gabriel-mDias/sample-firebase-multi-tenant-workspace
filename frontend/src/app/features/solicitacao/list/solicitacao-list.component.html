<div class="list-container animate__animated animate__fadeIn">
  <div class="header">
    <div class="header-titles">
      <h2>Solicitações</h2>
      <p class="subtitle">Acompanhe o fluxo das solicitações.</p>
    </div>
    @if (podeInserir()) {
      <button type="button" class="btn-novo" (click)="novo()">
        <i class="fa-solid fa-plus"></i>
        Nova solicitação
      </button>
    }
  </div>

  <gems-form-card
    title="Filtros"
    subtitle="Refine a lista de solicitações"
    icon="fa-solid fa-filter"
  >
    <form [formGroup]="filtroForm" class="form-grid" appEnterBusca (buscar)="aplicarFiltro()">
      <div class="form-group">
        <label class="fw-bold">Título</label>
        <gems-input-text
          formControlName="titulo"
          placeholder="Parte do título"
          icon="fa-solid fa-magnifying-glass"
        ></gems-input-text>
      </div>

      <div class="form-group">
        <label class="fw-bold">Situação</label>
        <gems-select
          formControlName="situacao"
          placeholder="Todas"
          [options]="situacoes"
        ></gems-select>
      </div>
    </form>

    <div gems-form-card-footer class="filtro-acoes">
      <button type="button" class="btn-cancel" (click)="limpar()">
        <i class="fa-solid fa-eraser"></i>
        Limpar
      </button>
      <button type="button" class="btn-save" (click)="aplicarFiltro()">
        Buscar
        <i class="fa-solid fa-magnifying-glass"></i>
      </button>
    </div>
  </gems-form-card>

  <gems-table
    class="tabela-solicitacoes"
    rowId="id"
    [columns]="columns"
    [data]="rows()"
    [actions]="actions"
    [labels]="labels"
    [isLoading]="isLoading()"
    [emptyMessage]="emptyMessage()"
    [totalRecords]="totalRecords()"
    [page]="pageable().page ?? 0"
    [size]="pageable().size ?? 10"
    [sortField]="sortField()"
    [sortDirection]="sortDirection()"
    (pageChange)="onPageChange($event)"
    (actionClick)="onAction($event)"
  ></gems-table>
</div>
