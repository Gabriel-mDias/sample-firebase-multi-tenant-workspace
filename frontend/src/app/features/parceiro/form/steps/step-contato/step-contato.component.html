<gems-form-card
  title="Contato"
  subtitle="Canal de atendimento do parceiro."
  icon="fa-solid fa-address-book"
>
  <app-contato-fields
    [form]="formGroup"
    placeholderEmail="consolato.cidade@esteri.it"
    placeholderTelefone="+39 06 4674 1 ou (21) 3534-1300"
    hintTelefone="Aceita código internacional (DDI) — o parceiro pode atender do exterior."
  ></app-contato-fields>

  <div gems-form-card-footer class="step-actions">
    <button type="button" class="btn-secondary" (click)="goBack()">
      <i class="fa-solid fa-arrow-left"></i>
      Voltar
    </button>
    <button type="button" class="btn-save" (click)="avancar()">
      Avançar
      <i class="fa-solid fa-arrow-right"></i>
    </button>
  </div>
</gems-form-card>
