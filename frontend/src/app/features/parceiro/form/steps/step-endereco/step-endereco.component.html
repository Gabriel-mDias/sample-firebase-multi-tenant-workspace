<gems-form-card
  title="Endereço"
  subtitle="Onde o parceiro está. UF e CEP só são exigidos no Brasil."
  icon="fa-solid fa-location-dot"
>
  <form [formGroup]="formGroup" class="form-grid">
    <div class="form-group">
      <label class="required fw-bold">País</label>
      <gems-select
        formControlName="paisId"
        placeholder="Selecione o país"
        [options]="paises()"
      ></gems-select>
      <gems-field-error
        [control]="formGroup.get('paisId')"
        [messages]="erroPais"
      ></gems-field-error>
    </div>

    @if (exigeUfECep()) {
      <div class="form-group">
        <label class="required fw-bold">Estado</label>
        <gems-select
          formControlName="estadoId"
          placeholder="Selecione o estado"
          [options]="estados()"
        ></gems-select>
        <gems-field-error
          [control]="formGroup.get('estadoId')"
          [messages]="erroEstado"
        ></gems-field-error>
      </div>

      <div class="form-group">
        <label class="required fw-bold">CEP</label>
        <gems-input-mask formControlName="cep" maskType="cep" placeholder="00000-000">
        </gems-input-mask>
        <gems-field-error [control]="formGroup.get('cep')" [messages]="erroCep"></gems-field-error>
      </div>
    }

    <div class="form-group">
      <label class="required fw-bold">Cidade</label>
      <gems-input-text formControlName="cidade" [maxlength]="255"></gems-input-text>
      <gems-field-error
        [control]="formGroup.get('cidade')"
        [messages]="erroCidade"
      ></gems-field-error>
    </div>

    <div class="form-group">
      <label class="required fw-bold">Bairro</label>
      <gems-input-text formControlName="bairro" [maxlength]="255"></gems-input-text>
      <gems-field-error
        [control]="formGroup.get('bairro')"
        [messages]="erroBairro"
      ></gems-field-error>
    </div>

    <div class="form-group full-width">
      <label class="required fw-bold">Logradouro</label>
      <gems-input-text formControlName="logradouro" [maxlength]="255"></gems-input-text>
      <gems-field-error
        [control]="formGroup.get('logradouro')"
        [messages]="erroLogradouro"
      ></gems-field-error>
    </div>

    <div class="form-group">
      <label class="fw-bold">Número</label>
      <gems-input-text formControlName="numero" [maxlength]="255"></gems-input-text>
    </div>

    <div class="form-group">
      <label class="fw-bold">Complemento</label>
      <gems-input-text formControlName="complemento" [maxlength]="255"></gems-input-text>
    </div>
  </form>

  <div gems-form-card-footer class="step-actions">
    <button type="button" class="btn-back" (click)="goBack()">
      <i class="fa-solid fa-arrow-left"></i>
      Voltar
    </button>
    <button type="button" class="btn-save" (click)="avancar()">
      Avançar
      <i class="fa-solid fa-arrow-right"></i>
    </button>
  </div>
</gems-form-card>
