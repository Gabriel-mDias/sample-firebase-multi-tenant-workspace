<div class="form-container animate__animated animate__fadeIn">
  <div class="header">
    <button type="button" class="btn-back" aria-label="Voltar para a lista" (click)="sair()">
      <i class="fa-solid fa-arrow-left"></i>
    </button>

    <div class="header-titles">
      <h2>{{ titulo() }}</h2>
      <p class="subtitle">{{ descricao() }}</p>
    </div>

    @if (!state.isReadOnly()) {
      <button type="button" class="btn-danger" (click)="sair()">
        <i class="fa-solid fa-xmark"></i>
        Cancelar
      </button>
    }
    <app-botao-historico entidade="Parceiro" [registroId]="registroId()" />
  </div>

  <!-- O stepper fica fora de qualquer card, logo abaixo do cabeçalho: o progresso é da página
       inteira, não de um passo específico. -->
  <gems-wizard
    [steps]="steps"
    [currentStep]="state.currentStep()"
    (stepChange)="onStepChange($event)"
  ></gems-wizard>

  @if (isCarregando()) {
    <div class="form-loading">
      <i class="fa-solid fa-circle-notch fa-spin"></i>
      <span>Carregando parceiro…</span>
    </div>
  } @else {
    @switch (state.currentStep()) {
      @case (stepDados) {
        <app-step-dados></app-step-dados>
      }
      @case (stepContato) {
        <app-step-contato></app-step-contato>
      }
      @case (stepEndereco) {
        <app-step-endereco></app-step-endereco>
      }
      @default {
        <app-step-resumo
          [isLoading]="isLoading()"
          (confirmar)="confirmar()"
          (sair)="sair()"
        ></app-step-resumo>
      }
    }
  }
</div>
