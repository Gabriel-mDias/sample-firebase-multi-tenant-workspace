<div class="list-container animate__animated animate__fadeIn">
  <div class="header">
    <div class="header-titles">
      <h2>Parceiros</h2>
      <p class="subtitle">Gerencie o cadastro de parceiros.</p>
    </div>
    @if (podeInserir()) {
      <button type="button" class="btn-novo" (click)="novo()">
        <i class="fa-solid fa-plus"></i>
        Novo parceiro
      </button>
    }
  </div>

  <gems-form-card title="Filtros" subtitle="Refine a lista de parceiros" icon="fa-solid fa-filter">
    <form [formGroup]="filtroForm" class="form-grid" appEnterBusca (buscar)="aplicarFiltro()">
      <div class="form-group">
        <label class="fw-bold">Nome</label>
        <gems-input-text
          formControlName="nome"
          placeholder="Parte do nome do parceiro"
          icon="fa-solid fa-magnifying-glass"
        ></gems-input-text>
      </div>

      <div class="form-group">
        <label class="fw-bold">CPF</label>
        <gems-input-text
          formControlName="cpf"
          placeholder="Somente dígitos"
          icon="fa-solid fa-id-card"
        ></gems-input-text>
      </div>
    </form>

    <div gems-form-card-footer class="filtro-acoes">
      <button type="button" class="btn-cancel" (click)="limpar()">
        <i class="fa-solid fa-eraser"></i>
        Limpar
      </button>
      <button type="button" class="btn-save" (click)="aplicarFiltro()">
        Buscar
        <i class="fa-solid fa-magnifying-glass"></i>
      </button>
    </div>
  </gems-form-card>

  <!-- A tabela é um elemento da tela por si só: sem card em volta, apenas espaçada do card de
       filtros. -->
  <gems-table
    class="tabela-parceiros"
    rowId="id"
    [columns]="columns()"
    [data]="rows()"
    [actions]="actions"
    [labels]="labels"
    [isLoading]="isLoading()"
    [emptyMessage]="emptyMessage()"
    [totalRecords]="totalRecords()"
    [page]="pageable().page ?? 0"
    [size]="pageable().size ?? 10"
    [sortField]="sortField()"
    [sortDirection]="sortDirection()"
    (pageChange)="onPageChange($event)"
    (actionClick)="onAction($event)"
  ></gems-table>
</div>
