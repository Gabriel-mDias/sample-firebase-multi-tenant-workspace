@if (podeVerAuditoria() && registroId()) {
  <button
    type="button"
    class="btn-secondary btn-historico"
    title="Ver quem alterou este registro"
    (click)="abrir()"
  >
    <i class="fa-solid fa-clock-rotate-left"></i>
    Histórico
  </button>

  <app-historico-registro
    [open]="aberto()"
    [entidade]="entidade()"
    [registroId]="registroId()"
    (fechar)="fechar()"
  />
}
